services:
  w2e_server:
    build:
      context: ./what2eat_server
      dockerfile: Dockerfile
    container_name: w2e_server
    networks:
      - caddy_net
    expose:
      - 5000
    volumes:
      - ./what2eat_server:/what2eat_server
      - ./what2eat_server/what2eat_sqlite:/what2eat_sqlite
      - /what2eat_server/node_modules
    working_dir: /what2eat_server
    restart: unless-stopped
    command: npm run start

  w2e_sqlite:
    build:
      context: ./what2eat_server/what2eat_sqlite
      dockerfile: Dockerfile
    container_name: w2e_sqlite
    networks:
      - caddy_net
    expose:
      - 4000
    volumes:
      - ./what2eat_server/what2eat_sqlite:/what2eat_sqlite
    working_dir: /what2eat_sqlite
    env_file: ".env"
    restart: unless-stopped
    command: python3 w2e_sqlite.py what2eat.sqlite

  w2e_client:
    build:
      context: ./what2eat_client
      dockerfile: Dockerfile
    container_name: w2e_client
    networks:
      - caddy_net
    expose:
      - 3000
    volumes:
      - ./what2eat_client:/what2eat_client
      - /what2eat_client/node_modules
    working_dir: /what2eat_client
    restart: unless-stopped
    command: npm run build-start

networks:
  caddy_net:
    external: true
